name: otaway

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: otaway-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_PORT: 8080
    ports:
      - '8081:8080'
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e "GET /realms/otaway HTTP/1.1\nHost: localhost\nConnection: close\n\n" >&3 && cat <&3 | grep -q "200 OK"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
